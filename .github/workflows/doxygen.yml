name: Deploy Sphinx ReadTheDocs to GitHub Pages

on:
  push:
    branches: ["main"] # Change to "master" if needed

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install Doxygen
        run: |
          sudo apt-get update
          sudo apt-get install -y doxygen graphviz

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-numeric-version: '3.10'

      - name: Install Sphinx and Read the Docs Theme
        run: |
          pip install sphinx breathe sphinx-rtd-theme

      - name: Run Doxygen (Generate XML)
        run: doxygen Doxyfile

      - name: Run Sphinx (Generate HTML website)
        run: sphinx-build -b html . ./docs/html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload Artifacts
        uses: actions/upload-pages-artifact@v3
        with:
          path: './docs/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

